events {}

http {

    upstream minio_api { #uygulamaların minioya bağlanacağı port
        server minio1:9000;
        server minio2:9000;
        server minio3:9000;
        server minio4:9000;
    }

    upstream minio_console { #minio konsoluna bağlanmak için kullanılacak port
        server minio1:9001;
        server minio2:9001;
        server minio3:9001;
        server minio4:9001;
    }

    server {
        listen 9000; 

        location / {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; #İstek hangi istemci/proxy IP'lerinden geçti?
            proxy_set_header X-Forwarded-Proto $scheme; #HTTP mi HTTPS mi kullanıldı?

            proxy_connect_timeout 300;
            proxy_http_version 1.1;

            proxy_set_header Connection "";

            chunked_transfer_encoding off;

            proxy_pass http://minio_api; #istekleri minio_api upstreamine yönlendirir
        }
    }

    server {
        listen 9001;

        location / {
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 300;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_pass http://minio_console; #istekleri minio_console upstreamine yönlendirir
        }
    }
}